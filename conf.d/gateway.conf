# ==============================================================================
# HTTP (Port 80) Catch-All Server Block: Health Check & HTTPS Redirection
# ==============================================================================
server {
    listen 80 default_server;
    server_name alldare.local *.alldare.local alldare.online *.alldare.online _;

    # Health check ping (unencrypted HTTP)
    location /health {
        access_log off;
        content_by_lua_block {
            ngx.say("OK")
            ngx.say("JWKS_URL: " .. (os.getenv("JWKS_URL") or "NOT SET"))
        }
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        header_filter_by_lua_block {
            ngx.header["Access-Control-Allow-Origin"] = "*"
            ngx.header["Access-Control-Allow-Methods"] = "GET, POST, PUT, DELETE, OPTIONS, PATCH"
            ngx.header["Access-Control-Allow-Headers"] = "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id"
        }
        if ($request_method = 'OPTIONS') {
            content_by_lua_block {
                ngx.header["Access-Control-Max-Age"] = 1728000
                ngx.header["Content-Type"] = "text/plain; charset=utf-8"
                ngx.header["Content-Length"] = 0
                ngx.exit(204)
            }
        }
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# Shared Upstream & DNS Resolver Configuration
# ==============================================================================
resolver 127.0.0.11 valid=30s;

# ==============================================================================
# SERVER BLOCK 1: Web UI SPA (alldare.local / alldare.online)
# ==============================================================================
server {
    listen 443 ssl default_server;
    server_name alldare.local alldare.online _;

    client_max_body_size 50M;
    resolver 127.0.0.11 valid=30s;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Standard Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Dynamic Upstream Definitions
    set_by_lua $auth_url 'return os.getenv("AUTH_SERVICE_URL") or "http://alldare-auth:9000"';
    set_by_lua $posts_url 'return os.getenv("POSTS_SERVICE_URL") or "http://alldare-posts:8080"';
    set_by_lua $media_url 'return os.getenv("MEDIA_SERVICE_URL") or "http://alldare-media:8081"';
    set_by_lua $feeds_url 'return os.getenv("FEEDS_SERVICE_URL") or "http://alldare-feeds:8082"';
    set_by_lua $profiles_url 'return os.getenv("PROFILES_SERVICE_URL") or "http://alldare-profiles:8083"';
    set_by_lua $podcasts_url 'return os.getenv("PODCASTS_SERVICE_URL") or "http://alldare-posts:8080"';
    set_by_lua $api_url 'return os.getenv("API_SERVICE_URL") or "http://alldare-api:8080"';
    set_by_lua $web_url 'return os.getenv("WEB_SERVICE_URL") or "http://alldare-publisher:4200"';

    # OAuth2 Authentication Endpoints (Proxy to alldare-auth:9000)
    location /oauth2 {
        proxy_pass $auth_url$request_uri;
    }

    location /login/oauth2/code {
        proxy_pass $auth_url$request_uri;
    }

    # REST Microservice API Ingress Proxy Routes (For Web SPA requests on alldare.local)
    location /api/v1/podcasts {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $podcasts_url$request_uri;
    }

    location /api/v1/posts {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $posts_url$request_uri;
    }

    location /api/v1/storage {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $media_url$request_uri;
    }

    location /alldare-media/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id' always;

        proxy_pass http://minio:9000/alldare-media/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/feeds {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $feeds_url$request_uri;
    }

    location /api/v1/subscriptions {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $profiles_url$request_uri;
    }

    location /api/v1/profiles/me {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $profiles_url$request_uri;
    }

    location /api/v1/profiles {
        proxy_pass $profiles_url$request_uri;
    }

    location /api/v1/auth {
        proxy_pass $auth_url$request_uri;
    }

    # Audio/Video MP3 & MP4 Stream Proxy (Apple Podcasts & Spotify HTTP 206 Range Compliant)
    location /podcasts/stream/ {
        proxy_pass $podcasts_url$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Web UI SPA Proxy
    location / {
        proxy_pass $web_url$request_uri;
        proxy_redirect http://alldare-publisher:4200/ /;
        proxy_redirect https://alldare-publisher:4200/ /;
        proxy_redirect http://web:4200/ /;
        proxy_redirect https://web:4200/ /;
    }
}

# ==============================================================================
# SERVER BLOCK 2: REST API Gateway (api.alldare.local / api.alldare.online)
# ==============================================================================
server {
    listen 443 ssl;
    server_name api.alldare.local api.alldare.online;

    client_max_body_size 50M;
    resolver 127.0.0.11 valid=30s;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Standard Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Global CORS configuration logic
    set_by_lua_block $cors_origin {
        local origin = ngx.var.http_origin
        if origin and (
            origin:find("^https?://localhost") or
            origin:find("^https?://127%.0%.0%.1") or
            origin:find("^https?://[^/]*alldare%.local") or
            origin:find("^https?://[^/]*alldare%.online")
        ) then
            return origin
        end
        return ""
    }

    header_filter_by_lua_block {
        local cors_origin = ngx.var.cors_origin
        if cors_origin and cors_origin ~= "" then
            ngx.header["Access-Control-Allow-Origin"] = cors_origin
            ngx.header["Access-Control-Allow-Methods"] = "GET, POST, PUT, DELETE, OPTIONS, PATCH"
            ngx.header["Access-Control-Allow-Headers"] = "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id"
            ngx.header["Access-Control-Allow-Credentials"] = "true"
            ngx.header["Access-Control-Expose-Headers"] = "Content-Length,Content-Range,X-User-ID,X-User-Roles"
        end
    }

    set_by_lua $auth_url 'return os.getenv("AUTH_SERVICE_URL") or "http://alldare-auth:9000"';
    set_by_lua $posts_url 'return os.getenv("POSTS_SERVICE_URL") or "http://alldare-posts:8080"';
    set_by_lua $media_url 'return os.getenv("MEDIA_SERVICE_URL") or "http://alldare-media:8081"';
    set_by_lua $feeds_url 'return os.getenv("FEEDS_SERVICE_URL") or "http://alldare-feeds:8082"';
    set_by_lua $profiles_url 'return os.getenv("PROFILES_SERVICE_URL") or "http://alldare-profiles:8083"';
    set_by_lua $statistics_url 'return os.getenv("STATISTICS_SERVICE_URL") or "http://alldare-statistics:8084"';
    set_by_lua $comments_url 'return os.getenv("COMMENTS_SERVICE_URL") or "http://alldare-comments:8086"';
    set_by_lua $notifications_url 'return os.getenv("NOTIFICATIONS_SERVICE_URL") or "http://alldare-notifications:8087"';
    set_by_lua $podcasts_url 'return os.getenv("PODCASTS_SERVICE_URL") or "http://alldare-posts:8080"';
    set_by_lua $api_url 'return os.getenv("API_SERVICE_URL") or "http://alldare-api:8080"';

    # OAuth2 Authentication Endpoints
    location /oauth2 {
        proxy_pass $auth_url$request_uri;
    }

    location /login/oauth2/code {
        proxy_pass $auth_url$request_uri;
    }

    # Protected Endpoints (Lua JWT Verification)
    location /api/v1/podcasts {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $podcasts_url$request_uri;
    }

    location /api/v1/posts {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $posts_url$request_uri;
    }

    location /api/v1/storage {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $media_url$request_uri;
    }

    location /alldare-media/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id' always;

        proxy_pass http://minio:9000/alldare-media/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/feeds {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $feeds_url$request_uri;
    }

    location /api/v1/subscriptions {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $profiles_url$request_uri;
    }

    location /api/v1/profiles/me {
        access_by_lua_file /etc/nginx/lua/verify_jwt.lua;
        proxy_pass $profiles_url$request_uri;
    }

    location /api/v1/profiles {
        proxy_pass $profiles_url$request_uri;
    }

    location /api/v1/auth {
        proxy_pass $auth_url$request_uri;
    }

    location / {
        proxy_pass $api_url$request_uri;
    }
}

# ==============================================================================
# SERVER BLOCK 3: Podcast Feeds & Streaming (podcasts.alldare.local / podcasts.alldare.online)
# Available over BOTH HTTP (Port 80) and HTTPS (Port 443)
# ==============================================================================
server {
    listen 80;
    listen 443 ssl;
    server_name podcasts.alldare.local podcasts.alldare.online;

    client_max_body_size 50M;
    resolver 127.0.0.11 valid=30s;

    # SSL Certificates (Used when requested via Port 443 HTTPS)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Standard Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    set_by_lua $podcasts_url 'return os.getenv("PODCASTS_SERVICE_URL") or "http://alldare-posts:8080"';
    set_by_lua $web_url 'return os.getenv("WEB_SERVICE_URL") or "http://alldare-phase0-ui:4200"';

    # Clean Rooted Feed URL Rewrites (/:slug/rss.xml -> /podcasts/shows/:slug/rss.xml)
    location ~ ^/([^/]+)/(rss\.xml|atom\.xml)$ {
        rewrite ^/([^/]+)/rss\.xml$ /podcasts/shows/$1/rss.xml break;
        rewrite ^/([^/]+)/atom\.xml$ /podcasts/shows/$1/atom.xml break;
        proxy_pass $podcasts_url;
    }

    # Backward-compatible Feed URL Rewrites (/podcast/:slug/rss.xml -> /podcasts/shows/:slug/rss.xml)
    location ~ ^/podcast/([^/]+)/(rss\.xml|atom\.xml)$ {
        rewrite ^/podcast/([^/]+)/rss\.xml$ /podcasts/shows/$1/rss.xml break;
        rewrite ^/podcast/([^/]+)/atom\.xml$ /podcasts/shows/$1/atom.xml break;
        proxy_pass $podcasts_url;
    }

    # Internal Feed Endpoints
    location /podcasts/shows/ {
        proxy_pass $podcasts_url$request_uri;
    }

    # REST API Endpoints for Public Landing Pages & SPA
    location /api/v1/podcasts {
        proxy_pass $podcasts_url$request_uri;
    }

    location /api/v1/storage {
        proxy_pass $media_url$request_uri;
    }

    # Audio/Video MP3 & MP4 Stream Proxy (Apple Podcasts & Spotify HTTP 206 Range Compliant)
    location /podcasts/stream/ {
        proxy_pass $podcasts_url$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Public Web Landing Pages (Rooted at https://podcasts.alldare.local/:slug or /:slug/index.html) -> Proxy to Angular Web SPA
    location / {
        proxy_pass $web_url$request_uri;
        proxy_redirect http://alldare-publisher:4200/ /;
        proxy_redirect https://alldare-publisher:4200/ /;
        proxy_redirect http://web:4200/ /;
        proxy_redirect https://web:4200/ /;
    }
}

# ==============================================================================
# SERVER BLOCK 4: S3 Media CDN Delivery (cdn.alldare.local / cdn.alldare.online)
# Available over BOTH HTTP (Port 80) and HTTPS (Port 443)
# ==============================================================================
server {
    listen 80;
    listen 443 ssl;
    server_name cdn.alldare.local cdn.alldare.online;

    client_max_body_size 50M;
    resolver 127.0.0.11 valid=30s;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Standard Proxy Headers
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    set_by_lua $minio_media_url 'return os.getenv("MINIO_MEDIA_URL") or "http://minio:9000/alldare-media"';

    # Direct Asset CDN Delivery & Direct Presigned PUT Uploads
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id' always;

        proxy_pass $minio_media_url$request_uri;
    }
}
